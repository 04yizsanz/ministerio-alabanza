services:
  mysql:
    image: mysql:8.0
    container_name: ministerio-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ministerio_alabanza
      MYSQL_USER: ministerio_user
      MYSQL_PASSWORD: ministerio_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  mysql_data:
    driver: local
